<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Menschenmodelle · Grafikprüfung</title><style>body{margin:0;background:#20252c;color:#eee;font:14px system-ui}#stage{position:fixed;inset:0}aside{position:fixed;top:20px;left:20px;z-index:5;padding:16px;background:#14191fd9;border-radius:10px}button,select{padding:7px;margin:4px}pre{font-size:11px;max-width:350px}h1{font-size:18px;margin:0 0 10px}</style><script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/"}}</script><div id="stage"></div><aside><h1>Neue Menschenmodelle</h1><label>Pose <select id="pose" disabled><option value="idle">Stehen</option><option value="walk">Gehen</option><option value="sit">Sitzen</option><option value="deal">Karten verteilen</option></select></label><label>Ansicht <select id="view" disabled><option value="all">Alle Figuren</option><option value="man">Gesicht Mann</option><option value="man-dark">Gesicht Mann 2</option><option value="woman">Gesicht Frau</option></select></label><button id="hide">Bedienelemente ausblenden</button><pre id="metrics">Laden…</pre></aside><script type="module">
import {Engine,THREE} from '/js/three/engine.js';
import {preloadCharacters,createAvatar} from '/js/three/avatars.js';
import {disposeObject} from '/js/three/resources.js';
await preloadCharacters();localStorage.setItem('casino.quality','high');
const e=new Engine(document.querySelector('#stage'),{fov:40,position:[1.8,1.65,-4.8],target:[0,1.02,0],background:0x262c34,envIntensity:0.65,post:{grade:false,gtao:true},exposure:1.02});
e.adaptiveEnabled=false;e.addLights({key:[-3,6,-4],keyIntensity:2.6,hemi:0.75,fill:0.6,shadowSize:4});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:0x343c46,roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;e.scene.add(floor);
const variants=['man','man-dark','woman'];
const people=variants.map((variant,i)=>{const av=createAvatar({name:['Max','Tom','Lea'][i],variant,dealer:true});av.position.x=(i-1)*0.9;av.userData.label.visible=false;e.scene.add(av);return av;});
let pose='idle',frame=0;const chairs=people.map(av=>{const seat=new THREE.Mesh(new THREE.BoxGeometry(0.44,0.06,0.40),new THREE.MeshStandardMaterial({color:0x602b38,roughness:0.9}));seat.position.set(av.position.x,0.695,0.04);seat.visible=false;seat.castShadow=true;seat.receiveShadow=true;e.scene.add(seat);return seat;});
document.querySelector('#pose').onchange=event=>{pose=event.target.value;people.forEach(av=>av.userData.setPose(pose==='sit'?'sit':'idle'));chairs.forEach(c=>c.visible=pose==='sit');};
document.querySelector('#view').onchange=event=>{const i=variants.indexOf(event.target.value);if(i<0){e.camera.position.set(1.8,1.65,-4.8);e.camera.lookAt(0,1.02,0);}else{const x=people[i].position.x,h=people[i].userData.model.getObjectByName('Human').userData.height;e.camera.position.set(x+0.24,h-0.13,-0.92);e.camera.lookAt(x,h-0.18,-0.04);}};
document.querySelector('#hide').onclick=()=>document.querySelector('aside').style.display='none';
e.onUpdate((dt,t)=>{for(const av of people)pose==='deal'?av.userData.dealerStep(dt,t):av.userData.step(dt,pose==='walk');if(++frame%60===0){let meshes=0,skeletons=new Set();for(const av of people)av.traverse(o=>{if(o.isSkinnedMesh){meshes++;skeletons.add(o.skeleton);}});document.querySelector('#metrics').textContent=JSON.stringify({pose,meshes,skeletons:skeletons.size,drawCalls:e.renderer.info.render.calls,gpu:e.renderer.info.memory},null,2);}});document.querySelectorAll('select').forEach(s=>s.disabled=false);e.start();
</script></html>
